server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ucbps}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:ucbps}
    password: ${DB_PASSWORD:change_me_local_only}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      enabled: false

ucbps:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl-minutes: ${JWT_TTL_MINUTES:60}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  redis:
    enabled: ${REDIS_ENABLED:false}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
