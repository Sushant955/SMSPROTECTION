# Whole stack locally:  docker compose up --build
# API http://localhost:8080 · ML http://localhost:8000 · Dashboard http://localhost:5173
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ucbps
      POSTGRES_USER: ucbps
      POSTGRES_PASSWORD: change_me_local_only
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucbps"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_PASSWORD: change_me_local_only
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      JWT_SECRET: local-dev-secret-local-dev-secret-local-dev-secret
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: ChangeMe123!
      CORS_ORIGINS: http://localhost:5173
    ports: ["8080:8080"]

  ml:
    build: ./ml-engine
    ports: ["8000:8000"]

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_URL: http://localhost:8080
    ports: ["5173:80"]

volumes:
  pgdata:
